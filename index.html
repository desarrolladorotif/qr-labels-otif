<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta QR - OTIF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 300;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 18px;
        }
        
        .content {
            padding: 40px;
        }
        
        .info-grid {
            display: grid;
            gap: 25px;
        }
        
        .info-item {
            background: linear-gradient(145deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }
        
        .info-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .info-label {
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-value {
            font-size: 20px;
            color: #2c3e50;
            word-break: break-word;
            font-weight: 500;
            line-height: 1.4;
        }
        
        .timestamp {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e9ecef;
            color: #7f8c8d;
            font-size: 16px;
            background: #f8f9fa;
            margin: 40px -40px -40px;
            padding: 30px 40px;
        }
        
        .error, .loading {
            text-align: center;
            padding: 60px 40px;
        }
        
        .error {
            color: #e74c3c;
        }
        
        .loading {
            color: #7f8c8d;
        }
        
        .error h2, .loading h2 {
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 14px;
        }
        
        .test-section {
            background: #e8f4fd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid #b3d9ff;
        }
        
        .test-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin: 5px;
            font-size: 12px;
        }
        
        @media (max-width: 640px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header, .content {
                padding: 25px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .logo {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
            
            .info-item {
                padding: 20px;
            }
            
            .info-value {
                font-size: 18px;
            }
            
            .timestamp {
                margin: 30px -25px -25px;
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🏷️</div>
            <h1>Sistema de Etiquetas QR</h1>
            <p>OTIF - Logística y Distribución</p>
        </div>
        
        <div class="content" id="content">
            <div class="loading">
                <div class="spinner"></div>
                <h2>Cargando información...</h2>
                <p>Por favor espera un momento</p>
            </div>
        </div>
        
        <div class="footer">
            <p>🚀 Sistema de Etiquetas QR | OTIF 2025</p>
        </div>
    </div>

    <script>
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                producto: params.get('producto') || '',
                lote: params.get('lote') || '',
                plancha: params.get('plancha') || '',
                alto: params.get('alto') || '',
                largo: params.get('largo') || '',
                saldo: params.get('saldo') || '',
                total: params.get('total') || '',
                turno: params.get('turno') || '',
                operario: params.get('operario') || '',
                timestamp: params.get('timestamp') || ''
            };
        }

        function displayInfo() {
            const data = getUrlParams();
            const content = document.getElementById('content');
            
            // Verificar si hay datos válidos
            const hasData = Object.values(data).some(value => value !== '');
            
            if (!hasData) {
                content.innerHTML = `
                    <div class="error">
                        <h2>📱 Página de Prueba</h2>
                        <p>Esta es la página donde se mostrarán las etiquetas QR</p>
                        <div class="test-section">
                            <h3>🧪 Pruebas disponibles:</h3>
                            <a href="?producto=Cereal&lote=L123&plancha=P001&alto=150&largo=300&saldo=25&total=50&turno=1&operario=Juan" class="test-link">Prueba 1</a>
                            <a href="?producto=Galletas&lote=L456&plancha=P002&alto=200&largo=400&saldo=30&total=60&turno=2&operario=Maria" class="test-link">Prueba 2</a>
                        </div>
                        <small style="color: #95a5a6; display: block; margin-top: 20px;">
                            URL actual: ${window.location.href}
                        </small>
                    </div>
                `;
                return;
            }

            const fields = [
                { key: 'producto', label: '📦 Producto', icon: '📦' },
                { key: 'lote', label: '🏷️ Lote', icon: '🏷️' },
                { key: 'plancha', label: '📋 Plancha', icon: '📋' },
                { key: 'alto', label: '📏 Alto', icon: '📏' },
                { key: 'largo', label: '📐 Largo', icon: '📐' },
                { key: 'saldo', label: '📊 Saldo', icon: '📊' },
                { key: 'total', label: '🔢 Total', icon: '🔢' },
                { key: 'turno', label: '🕐 Turno', icon: '🕐' },
                { key: 'operario', label: '👤 Operario', icon: '👤' }
            ];

            let infoHtml = '<div class="info-grid">';
            
            fields.forEach(field => {
                const value = data[field.key];
                if (value) {
                    infoHtml += `
                        <div class="info-item">
                            <div class="info-label">${field.icon} ${field.label}</div>
                            <div class="info-value">${value}</div>
                        </div>
                    `;
                }
            });
            
            infoHtml += '</div>';
            
            if (data.timestamp) {
                infoHtml += `
                    <div class="timestamp">
                        <p><strong>🕒 Etiqueta generada:</strong> ${data.timestamp}</p>
                    </div>
                `;
            }

            content.innerHTML = infoHtml;
        }

        // Cargar datos cuando la página esté lista
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(displayInfo, 800);
        });
        
        // Debug información
        console.log('🔍 Debug Info:');
        console.log('URL actual:', window.location.href);
        console.log('Parámetros encontrados:', getUrlParams());
    </script>
</body>
</html>
